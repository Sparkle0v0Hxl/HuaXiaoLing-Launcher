    <div class="app">
      <aside class="sidebar">
        <div class="brand" data-nav="start" role="button" tabindex="0" title="进入启动页" aria-label="进入启动页">
          <img class="brand-mark" src="assets/character-face.png" alt="" aria-hidden="true">
          <div class="brand-text">
            <span class="brand-name">花筱灵</span>
            <span class="brand-en">HANABI STAGE</span>
          </div>
        </div>

        <!-- 滚动容器：窗口矮 / 工具组展开时整块可上下滚，别把底部「设置」顶出去 -->
        <div class="sidebar-scroll" id="sidebar-scroll">
          <nav class="nav" id="nav">
            <div class="nav-label">浏览</div>
            <button class="nav-item" data-nav="home">
              <svg class="icon"><use href="#i-home"></use></svg>
              <span>主页</span>
            </button>
            <button class="nav-item" data-nav="start">
              <svg class="icon"><use href="#i-play"></use></svg>
              <span>启动页</span>
            </button>
            <button class="nav-item" data-nav="gacha">
              <svg class="icon"><use href="#i-gacha"></use></svg>
              <span>抽卡</span>
            </button>
            <button class="nav-item" data-nav="song">
              <svg class="icon"><use href="#i-music"></use></svg>
              <span>音乐</span>
            </button>
            <button class="nav-item" data-nav="downloads">
              <svg class="icon"><use href="#i-download"></use></svg>
              <span>下载</span>
              <span class="nav-badge" id="badge-downloads" hidden>0</span>
            </button>
            <button class="nav-item" data-nav="news">
              <svg class="icon"><use href="#i-news"></use></svg>
              <span>动态</span>
            </button>
            <button class="nav-item" data-nav="tools">
              <svg class="icon"><use href="#i-wrench"></use></svg>
              <span>工具</span>
            </button>
            <button class="nav-item" data-nav="screenshots" hidden>
              <svg class="icon"><use href="#i-image"></use></svg>
              <span>截图管理</span>
            </button>
            <button class="nav-item" data-nav="graphics" hidden>
              <svg class="icon"><use href="#i-settings"></use></svg>
              <span>画质配置</span>
            </button>
            <!-- 只有「设置」一项，不再单开分组标签：一条细线分隔就够，
                 原先的「应用」二字下只挂一个设置，读起来像没写完 -->
            <div class="nav-divider" aria-hidden="true"></div>
            <button class="nav-item nav-item-system" data-nav="settings">
              <svg class="icon"><use href="#i-settings"></use></svg>
              <span>设置</span>
            </button>
          </nav>
        </div>

        <!-- 火花立绘：展开时是侧栏底部的一块形象区（真的占位，不压在导航上），
             收起时整块隐藏。放在「收起侧栏」上面，视线落点是 导航 → 立绘 → 收起。 -->
        <div class="sidebar-char" aria-hidden="true">
          <img src="assets/sparxie-fullbody.png" alt="" />
        </div>

        <button class="sidebar-toggle" data-action="toggle-sidebar" title="收起侧栏">
          <svg class="icon"><use href="#i-chevron-left"></use></svg>
          <span>收起侧栏</span>
        </button>

        <button class="profile" id="profile-btn" title="打开设置" aria-label="打开设置">
          <span class="avatar" id="profile-avatar">大</span>
          <span class="profile-text">
            <span class="profile-name" id="profile-name">大小姐</span>
          </span>
          <svg class="icon"><use href="#i-chevron-right"></use></svg>
        </button>
      </aside>

      <main class="main">
        <header class="titlebar">
          <div class="titlebar-left">
            <span class="dot"></span>
            <strong id="tb-section">主页</strong>
            <span class="titlebar-sep"></span>
            <span>花筱灵启动器</span>
          </div>
          <div class="titlebar-right">
            <span id="tb-version">v2.4.0</span>
            <div class="window-controls">
              <button class="window-control" data-action="window-minimize" title="最小化"><svg class="icon"><use href="#i-minus"></use></svg></button>
              <button class="window-control" data-action="window-maximize" title="最大化"><svg class="icon"><use href="#i-maximize"></use></svg></button>
              <button class="window-control window-control-close" data-action="window-close" title="关闭"><svg class="icon"><use href="#i-x"></use></svg></button>
            </div>
          </div>
        </header>
        <div class="view" id="view"></div>
        <!-- 除启动页外所有页面常驻的装饰层：花火 / 火花挂饰 + 淡角色背景。pointer-events:none 不挡操作 -->
        <div class="page-deco" id="page-deco" aria-hidden="true">
          <div class="page-deco-bg"><img src="assets/sparxie-fullbody.png" alt="" draggable="false" /></div>
          <span class="page-deco-charm page-deco-charm--sparkle"><img src="assets/sparkle-mask.png" alt="" draggable="false" /></span>
          <span class="page-deco-charm page-deco-charm--sparxie"><img src="assets/sparxie-charm.png" alt="" draggable="false" /></span>
          <span class="page-deco-sprite page-deco-sprite--fireworks"><img src="assets/charm-fireworks.png" alt="" draggable="false" /></span>
          <span class="page-deco-sprite page-deco-sprite--flame"><img src="assets/charm-flame.png" alt="" draggable="false" /></span>
          <span class="page-deco-sprite page-deco-sprite--stars"><img src="assets/charm-stars.png" alt="" draggable="false" /></span>
        </div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div class="toast-root" id="toast-root"></div>

    <audio id="song-audio" preload="metadata"></audio>

    <div class="mini-player is-chip" id="mini-player" hidden>
      <!-- 启动页形态：嵌在「选择游戏」标题右边的窄条 -->
      <div class="mini-chip" id="mini-chip" data-mini-drag>
        <button class="mini-chip-cover" id="mini-chip-cover" data-action="mini-open" title="打开音乐"><span>♪</span></button>
        <button class="mini-chip-copy" data-action="mini-expand" title="展开播放器">
          <strong id="mini-chip-title">未播放</strong>
          <small id="mini-chip-artist">音乐</small>
        </button>
        <button class="mini-chip-btn" data-action="mini-toggle" title="播放 / 暂停"><svg class="icon"><use id="mini-chip-play-use" href="#i-play"></use></svg></button>
        <button class="mini-chip-btn" data-action="mini-next" title="下一首"><svg class="icon"><use href="#i-chevron-right"></use></svg></button>
      </div>

      <!-- 展开形态 -->
      <div class="mini-panel">
        <div class="mini-panel-head">
          <button class="mini-grip" data-mini-drag title="按住拖动到任意位置" aria-label="拖动播放器"><svg class="icon"><use href="#i-grip"></use></svg></button>
          <button class="mini-cover" data-action="mini-open" title="打开音乐"><span>♪</span></button>
          <button class="mini-copy" data-action="mini-open" title="打开音乐">
            <strong id="mini-title">未播放</strong>
            <small id="mini-artist">音乐</small>
          </button>
          <button class="mini-collapse" data-action="mini-collapse" title="收起"><svg class="icon"><use href="#i-chevron-down"></use></svg></button>
          <button class="mini-close" data-action="mini-close" title="关闭播放器"><svg class="icon"><use href="#i-x"></use></svg></button>
        </div>
        <div class="mini-controls">
          <button class="mini-btn" data-action="mini-prev" title="上一首"><svg class="icon"><use href="#i-chevron-left"></use></svg></button>
          <button class="mini-btn mini-btn-play" data-action="mini-toggle" title="播放/暂停"><svg class="icon"><use id="mini-play-use" href="#i-play"></use></svg></button>
          <button class="mini-btn" data-action="mini-next" title="下一首"><svg class="icon"><use href="#i-chevron-right"></use></svg></button>
          <button class="mini-btn" data-action="cycle-play-mode" title="播放模式（点击切换）"><svg class="icon"><use id="mini-mode-use" href="#i-repeat"></use></svg></button>
          <button class="mini-btn" data-action="mini-list" title="歌曲列表"><svg class="icon"><use href="#i-library"></use></svg></button>
        </div>
        <div class="mini-volume">
          <button class="mini-btn" data-action="mini-mute" title="静音"><svg class="icon"><use id="mini-volume-use" href="#i-volume"></use></svg></button>
          <input class="mini-range" id="mini-volume" type="range" min="0" max="100" step="1" aria-label="音量" data-no-sound />
          <span class="mini-volume-value" id="mini-volume-value">80</span>
          <button class="mini-btn" data-action="open-audio-fx" title="音效设置"><svg class="icon"><use href="#i-headphones"></use></svg></button>
        </div>
        <span class="mini-progress"><i id="mini-progress-fill"></i></span>
      </div>
    </div>

    <div class="task-dock" id="task-dock" hidden>
      <div class="task-dock-list" id="task-dock-list"></div>
    </div>

    <!-- 通用工具（拆分第三批）：esc / icon 被几百处模板调用，必须排在最前 -->
    <script src="services/helpers.js"></script>
    <!-- 音效服务（拆分第一批）：必须早于 app.js —— app.js 的 state 初始化会读
       AUDIO_FX_STORAGE，排错就是 TDZ ReferenceError、直接白屏 -->
    <script src="services/audio-fx.js"></script>
    <!-- 界面音效合成（拆分第二批）：同样必须早于 app.js，启动时会调 playUiSound -->
    <script src="services/ui-sound.js"></script>
    <!-- 更新域（拆分第三批）：发现新版本弹窗 / 更新内容公告 / 版本配图 -->
    <script src="services/update.js"></script>
    <script src="song-ui.js"></script>
    <!-- 视图层 chrome + 路由 + render 主循环（拆分第四批）：必须早于 app.js -->
    <script src="views/chrome.js"></script>
    <!-- 视图层首页 + 启动页（拆分第五批）：必须早于 app.js -->
    <script src="views/home.js"></script>
    <!-- 视图层游戏库（拆分第六批）：必须早于 app.js -->
    <script src="views/library.js"></script>
    <!-- 视图层服务器/更新面板（拆分第七批）：服务器卡片、切服、预下载、修游戏。
       必须早于 app.js —— views/home.js 的启动页服务器面板运行时调 serverRow -->
    <script src="views/servers.js"></script>
    <!-- 视图层抽卡记录页（拆分第八批）：固定游戏表、卡片、整页、导入/同步弹窗。
       chrome.js 的视图表 gacha → gachaView2，必须早于 app.js -->
    <script src="views/gacha.js"></script>
    <!-- 视图层音乐播放器核心（拆分第九批）：点歌队列存档、播放模式、音质档位、
       播不动跳下一首、进度记忆、迷你播放器、歌词区、直播间点歌桥接。
       与其他 views 一样统一排在 app.js 之前：函数是调用时才解析名字，
       但这里的顶层常量（PLAY_MODES / QUALITY_LEVELS / SONG_PROGRESS_KEY 等）
       若哪天被 app.js 顶层用到，排在后面就是 TDZ 白屏 -->
    <script src="views/song.js"></script>
    <!-- 视图层音乐歌单数据层（拆分第十批）：歌单广场、我的歌单同步与缓存、歌单详情、
       播放歌单与队列填充、音乐登录状态、榜单入队、歌单搜索、直播间弹幕点歌、音质档位。
       同样必须早于 app.js：这里的顶层常量（PLAYLIST_CACHE_TTL / PLAYLIST_DETAIL_TTL /
       PLAYLIST_LINK_API_DEFAULT 等）若被 app.js 顶层读到，排后面就是 TDZ 白屏 -->
    <script src="views/song-playlist.js"></script>
    <!-- 视图层音乐视图与弹窗（拆分第十一批）：导入歌单 / 添加歌曲弹窗、音乐源与播放设置、
       直播间房间与弹幕面板、点歌台整页与 songView（chrome.js 视图表指向它）、
       歌单卡片与详情、我的歌单分组、榜单面板。
       同样排在 app.js 之前；顶层常量（MUSIC_SOURCE_LABELS / MUSIC_PLATFORM_LABELS /
       PLAYLIST_LINK_API_DEFAULT 等）不能移出本文件之后，否则 app.js 里设置页读它们会 TDZ -->
    <script src="views/song-view.js"></script>
    <!-- 下载任务队列（downloadsView / downloadRow / statusInfo）+ 渠道资源补齐链路：
         NTE 预下载窗、抓包状态、账号同步面板、终末地打包弹窗。
         同样排在 app.js 之前，跨文件全局解析，调用关系不变 -->
    <script src="views/downloads.js"></script>
    <!-- 工具页 / 动态页 / 官方公告（能力注册表、米游社·HoYoLAB 登录、截图管理、
         插件面板、画质配置、战绩页、更新日志与公告）。
         排在 app.js 之前：顶层只有纯字面量常量与函数声明，函数体内才读 state / dom；
         插件相关的调用也在函数体内，运行时才跑，早于 plugin-runtime.js 加载不影响 -->
    <script src="views/tools.js"></script>
    <!-- 设置页（拆分第十四批）：开关组件、设置回显、界面缩放、主题与强调色候选值、
         设置页分组与整页渲染。
         排在 app.js 之前：顶层只有纯字面量常量表（THEME_OPTIONS / ACCENT_OPTIONS /
         SETTINGS_TABS / AUDIO_LANGUAGE_LABELS）与 settingsEcho（初值 null），
         没有 DOM 读取或立即执行的副作用 -->
    <script src="views/settings.js"></script>
    <!-- 视图层事件绑定（拆分第十五批）：封面 / 头像 / 战绩头像 / 抽卡头像的破图兜底，
         外加每次整页重绘后重挂监听（bindView）。顶层只有两个函数声明 -->
    <script src="views/bindings.js"></script>
    <!-- 全站动作分发（拆分第十五批）：toggleFavorite + handleAction 巨型 switch。
         顶层只有两个函数声明、零立即执行副作用；case 里调用的 openXxxModal / 各 api.*
         都在 app.js 与 views/* 里，运行时才解析 -->
    <script src="views/actions.js"></script>
    <!-- 弹窗装配（拆分第十六批）：openModal / closeModal / confirmDialog / 关闭三态询问框 /
         游戏、服务器、下载、Sophon 差异更新、任务坞、链接与动态详情。
         顶层有 5 个纯字面量常量表 + 3 个 let 游标（初值 null），加载期无副作用，
         且这 8 个名字在 app.js 剩余部分零引用 -->
    <script src="views/modals.js"></script>
    <!-- 提示条与状态回推（拆分第十七批）：toast / canPatchDownloads / patchDownloads / onState。
         顶层零声明、零立即执行，只注册函数；被全站上百处调用，所以必须早于 app.js -->
    <script src="views/toasts.js"></script>
    <!-- 战绩数据归一化：必须早于 app.js，app.js 渲染时会直接读 window.HXLRecord -->
    <script src="record-model.js"></script>
    <!-- 插件运行时：视图渲染（纯函数）+ Worker 宿主，必须早于 app.js -->
    <script src="plugin-runtime.js"></script>
<script src="app.js"></script>
    <!--
      插件页样式单独成文件：合并上游版本时不用再往几万行的 styles.css 里追加。
      这里用静态 link 而不是脚本动态创建 —— CSP 的 script-src 是 'self'，内联脚本会被拦掉。
    -->
    <link rel="stylesheet" href="plugin-ui.css" />
  </body>
</html>
