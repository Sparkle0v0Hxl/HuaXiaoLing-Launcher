<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>花筱灵启动器</title>
    <style>
      :root {
        --ink: #0b060b;
        --cream: #f8ead8;
        --muted: #a58d89;
        --gold: #f0c674;
        --gold-2: #ffe1a8;
        --red: #e8435a;
        --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, serif;
        --ui: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: var(--ui);
        color: var(--cream);
        background:
          radial-gradient(420px 360px at 50% 24%, rgba(232, 67, 90, 0.19), transparent 68%),
          radial-gradient(300px 260px at 18% 92%, rgba(240, 198, 116, 0.09), transparent 70%),
          linear-gradient(180deg, #10070d 0%, #080409 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.26s ease;
      }
      body.leaving {
        opacity: 0;
      }
      .splash {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 34px 42px 30px;
        isolation: isolate;
      }
      .splash::before {
        content: "";
        position: absolute;
        inset: 16px;
        border: 1px solid rgba(240, 198, 116, 0.18);
        border-radius: 22px;
        pointer-events: none;
      }
      .sparks {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 520px;
        height: 520px;
        transform: translate(-50%, -58%);
        color: var(--gold);
        opacity: 0.32;
        z-index: -1;
        animation: turn 26s linear infinite;
      }
      @keyframes turn {
        to {
          transform: translate(-50%, -58%) rotate(360deg);
        }
      }
      .portrait-wrap {
        position: relative;
        width: 326px;
        height: 326px;
        flex: none;
        border-radius: 32px;
        display: grid;
        place-items: center;
      }
      .portrait-wrap::before {
        content: "";
        position: absolute;
        inset: -20px;
        border-radius: 42px;
        background: radial-gradient(circle, rgba(232, 67, 90, 0.3), transparent 68%);
        filter: blur(18px);
      }
      .portrait-ring {
        position: absolute;
        inset: -8px;
        border: 1px solid rgba(240, 198, 116, 0.62);
        border-radius: 38px;
      }
      .portrait-ring::after {
        content: "";
        position: absolute;
        inset: -8px;
        border: 1px solid rgba(240, 198, 116, 0.16);
        border-radius: 44px;
      }
      .portrait-wrap img {
        position: relative;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 30px;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.5);
        animation: breathe 6s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          transform: scale(1.012);
        }
      }
      .brand {
        margin-top: 34px;
        font-family: var(--serif);
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-indent: 0.16em;
        line-height: 1.2;
        text-shadow: 0 4px 30px rgba(232, 67, 90, 0.22);
      }
      .en {
        margin-top: 8px;
        color: var(--gold);
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.4em;
        text-indent: 0.4em;
        opacity: 0.82;
      }
      .tagline {
        margin-top: 18px;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      .loading {
        width: 180px;
        height: 2px;
        margin-top: 34px;
        border-radius: 3px;
        background: rgba(240, 198, 116, 0.14);
        overflow: hidden;
      }
      .loading span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, var(--gold), var(--red), transparent);
        animation: load 1.5s ease-in-out infinite;
      }
      @keyframes load {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      .status {
        margin-top: 13px;
        color: var(--muted);
        font-size: 9.5px;
        letter-spacing: 0.16em;
      }
      .version {
        position: absolute;
        bottom: 30px;
        color: rgba(240, 198, 116, 0.34);
        font-size: 8.5px;
        letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <svg class="sparks" viewBox="0 0 520 520" aria-hidden="true">
        <g fill="none" stroke="currentColor">
          <circle cx="260" cy="260" r="180" opacity=".35" />
          <circle cx="260" cy="260" r="220" opacity=".16" />
          <path d="M260 8v112M260 400v112M8 260h112M400 260h112" opacity=".3" />
          <path d="M84 84l64 64M436 84l-64 64M84 436l64-64M436 436l-64-64" opacity=".18" />
          <path d="M260 112c9 58 37 86 95 95-58 9-86 37-95 95-9-58-37-86-95-95 58-9 86-37 95-95Z" opacity=".2" />
        </g>
        <g fill="currentColor">
          <circle cx="260" cy="70" r="2.4" opacity=".8" />
          <circle cx="452" cy="260" r="1.8" opacity=".5" />
          <circle cx="260" cy="450" r="1.6" opacity=".4" />
          <circle cx="68" cy="260" r="2" opacity=".55" />
        </g>
      </svg>
      <div class="portrait-wrap">
        <span class="portrait-ring"></span>
        <img src="assets/character.png" alt="花筱灵" />
      </div>
      <div class="brand">花筱灵</div>
      <div class="en">HANABI STAGE · GAME LAUNCHER</div>
      <div class="tagline">今夜，也为你的故事留一个舞台。</div>
      <div class="loading"><span></span></div>
      <div class="status">正在拉开帷幕…</div>
      <div class="version" id="splash-version">VERSION v2.6.0</div>
    </div>
  </body>
</html>
